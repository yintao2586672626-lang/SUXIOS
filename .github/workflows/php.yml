name: PHP Composer

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: php-composer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch_freshness:
    name: Branch freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch latest PR base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Verify PR head contains latest base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SUXI_PR_BASE_REF: origin/${{ github.base_ref }}
          SUXI_PR_HEAD_REF: HEAD
        run: npm run verify:pr-base-freshness

      - name: Record main push freshness scope
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Base freshness is enforced on pull requests; this event is a direct branch build."

  backend_db:
    name: Backend and database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: suxi-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install MySQL-compatible client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Verify fresh database, repeatable migration, and 8-way concurrency
        timeout-minutes: 10
        env:
          SUXI_CI_MYSQL_VERIFY: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASS: suxi-ci-root
          MYSQL_BINARY: mariadb
          PHP_BINARY: php
        run: npm run verify:mysql-fresh-concurrency

      - name: Verify historical tenant remap on MariaDB 10.11
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASS: suxi-ci-root
          MYSQL_BINARY: mariadb
        run: node scripts/verify_tenant_history_migration_mariadb.mjs

      - name: Verify owner tenant bootstrap on isolated MariaDB
        timeout-minutes: 5
        env:
          SUXIOS_TEST_DB_ALLOW_CREATE: '1'
          SUXIOS_TEST_DB_HOST: 127.0.0.1
          SUXIOS_TEST_DB_PORT: '3306'
          SUXIOS_TEST_DB_USER: root
          SUXIOS_TEST_DB_PASS: suxi-ci-root
          PHP_BINARY: php
        run: npm run verify:owner-tenant-bootstrap-mariadb

      - name: Initialize backend test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: php scripts/init_database.php

      - name: Run backend tests
        env:
          SUXI_E2E_DB_OVERRIDE: '1'
          SUXI_E2E_DB_NAME: hotelx_ci_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: composer test

  node_business_chain:
    name: Node and business-chain runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: suxi-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize Node test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: php scripts/init_database.php

      - name: Run Node automation tests
        timeout-minutes: 10
        env:
          PHP_BINARY: php
          SUXI_REQUIRE_BUSINESS_CHAIN_RUNTIME: '1'
          SUXI_E2E_DB_OVERRIDE: '1'
          SUXI_E2E_DB_NAME: hotelx_ci_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: npm run test:node

      - name: Verify OTA to revenue to operations business chain
        timeout-minutes: 5
        env:
          SUXI_PHP: php
          SUXI_E2E_DB_OVERRIDE: '1'
          SUXI_E2E_DB_NAME: hotelx_ci_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: npm run test:e2e:business

      - name: Verify full-render page transitions
        timeout-minutes: 4
        env:
          SUXI_PHP: php
          SUXI_E2E_DB_OVERRIDE: '1'
          SUXI_E2E_DB_NAME: hotelx_ci_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: npm run test:e2e:transition

      - name: Verify operating-question approval and floating-assistant journeys
        timeout-minutes: 4
        env:
          SUXI_PHP: php
          SUXI_E2E_DB_OVERRIDE: '1'
          SUXI_E2E_DB_NAME: hotelx_ci_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: npm run test:e2e:operating-question

      - name: Verify notification and security-monitoring stability journeys
        timeout-minutes: 4
        env:
          SUXI_PHP: php
          SUXI_E2E_DB_OVERRIDE: '1'
          SUXI_E2E_DB_NAME: hotelx_ci_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: npm run test:e2e:stability

  contracts:
    name: Dependency security and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate

      - name: Run canonical integration gate
        env:
          SUXI_MIGRATION_LOCK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify:integration

      - name: Run structural contract checks (not release approval)
        run: |
          php scripts/verify_missing_modules.php
          php scripts/verify_route_coverage.php
          node scripts/verify_business_chain_report_contract.mjs
          node scripts/verify_ai_model_config_i18n.mjs
          npm run verify:ota-competition-report
          npm run verify:ota-data-batch
          npm run verify:opening-batch-actions
          npm run review:functional-readiness
          npm run review:release-issues
          npm run verify:release-evidence-intake
          npm run verify:release-readiness-contract
          npm run review:non-security
          npm run review:report-security-finance
          npm run verify:release-status

      - name: Verify frontend static performance budget
        run: npm run verify:performance-budget

  skill_evidence:
    name: SUXIOS skill distribution and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout exact verification head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Bind checks to the exact Git head
        env:
          EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"
          printf 'suxi_skill_evidence_git_sha=%s\n' "$EXPECTED_GIT_SHA"

      - name: Verify 20-Skill package and replay governed behavior
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('plugins/suxi-os-toolkit/.codex-plugin/plugin.json', 'utf8'));
          const skills = readdirSync('plugins/suxi-os-toolkit/skills', { withFileTypes: true })
            .filter(entry => entry.isDirectory())
            .map(entry => entry.name)
            .sort();
          assert.equal(manifest.name, 'suxi-os-toolkit');
          assert.equal(manifest.version, '0.1.0+codex.20260829185643');
          assert.equal(skills.length, 20);
          assert.ok(skills.includes('suxi-product-decision'));
          assert.ok(skills.includes('suxi-test-guard'));
          assert.ok(skills.includes('suxi-user-research'));
          NODE
          node scripts/suxi_skill_behavior_eval.mjs verify-suite
          node scripts/suxi_skill_test_execution.mjs inspect-recovery

      - name: Run Skill evidence contract tests
        run: >-
          node --test --test-concurrency=1
          tests/automation/codex_cli_runtime.test.mjs
          tests/automation/suxi_plugin_distribution_audit.test.mjs
          tests/automation/suxi_skill_behavior_eval.test.mjs
          tests/automation/suxi_skill_contracts.test.mjs
          tests/automation/suxi_skill_test_execution_receipt.test.mjs

      - name: Run portable Skill status-reporter contracts
        run: >-
          node --test --test-concurrency=1
          --test-skip-pattern='current authoritative state|status reporter CLI exit codes'
          tests/automation/suxi_skill_evidence_status.test.mjs

  frontend_performance:
    name: Authenticated frontend performance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: suxi-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize performance test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: php scripts/init_database.php

      - name: Measure and verify authenticated frontend runtime budget
        timeout-minutes: 8
        env:
          SUXI_PHP: php
          SUXI_E2E_DB_OVERRIDE: '1'
          SUXI_E2E_DB_NAME: hotelx_ci_test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: hotelx_ci_test
          DB_USER: root
          DB_PASS: suxi-ci-root
        run: |
          npm run measure:performance:ci
          npm run verify:performance-runtime-budget

      - name: Preserve authenticated frontend performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: authenticated-frontend-performance-${{ github.run_attempt }}
          path: |
            output/performance/isolated-authenticated-baseline.json
            output/performance/ci-isolated-authenticated-*.json
          if-no-files-found: warn
          retention-days: 14

  windows_control_plane:
    name: Windows control-plane smoke
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify Windows scheduler, dispatcher, profile and hook controls
        timeout-minutes: 9
        env:
          PHP_BINARY: php
        run: >-
          node --test --test-concurrency=1
          tests/automation/dingdandao_local_scheduler_contract.test.mjs
          tests/automation/hotel_autopilot_scheduler_contract.test.mjs
          tests/automation/ota_dispatcher_provenance.test.mjs
          tests/automation/ota_dispatcher_registration_contract.test.mjs
          tests/automation/platform_profile_local_login.test.mjs
          tests/automation/project_state_generator.test.mjs
          tests/automation/public_entry_precommit_guard.test.mjs
          tests/automation/windows_ota_dispatcher_control.test.mjs
          tests/automation/windows_scheduled_loops_contract.test.mjs

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - branch_freshness
      - backend_db
      - node_business_chain
      - contracts
      - frontend_performance
      - skill_evidence
      - windows_control_plane
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Aggregate parallel verification results
        env:
          BRANCH_FRESHNESS_RESULT: ${{ needs.branch_freshness.result }}
          BACKEND_DB_RESULT: ${{ needs.backend_db.result }}
          NODE_BUSINESS_CHAIN_RESULT: ${{ needs.node_business_chain.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          FRONTEND_PERFORMANCE_RESULT: ${{ needs.frontend_performance.result }}
          SKILL_EVIDENCE_RESULT: ${{ needs.skill_evidence.result }}
          WINDOWS_CONTROL_PLANE_RESULT: ${{ needs.windows_control_plane.result }}
        run: |
          printf 'branch_freshness=%s\n' "$BRANCH_FRESHNESS_RESULT"
          printf 'backend_db=%s\n' "$BACKEND_DB_RESULT"
          printf 'node_business_chain=%s\n' "$NODE_BUSINESS_CHAIN_RESULT"
          printf 'contracts=%s\n' "$CONTRACTS_RESULT"
          printf 'frontend_performance=%s\n' "$FRONTEND_PERFORMANCE_RESULT"
          printf 'skill_evidence=%s\n' "$SKILL_EVIDENCE_RESULT"
          printf 'windows_control_plane=%s\n' "$WINDOWS_CONTROL_PLANE_RESULT"
          test "$BRANCH_FRESHNESS_RESULT" = "success"
          test "$BACKEND_DB_RESULT" = "success"
          test "$NODE_BUSINESS_CHAIN_RESULT" = "success"
          test "$CONTRACTS_RESULT" = "success"
          test "$FRONTEND_PERFORMANCE_RESULT" = "success"
          test "$SKILL_EVIDENCE_RESULT" = "success"
          test "$WINDOWS_CONTROL_PLANE_RESULT" = "success"
