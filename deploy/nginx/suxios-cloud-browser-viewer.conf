# The browser/VNC services remain loopback-only. Every asset and WebSocket
# request is authorized by the short-lived HttpOnly viewer cookie.
location = /_suxios_cloud_browser_viewer_auth {
    internal;
    # Re-enter the same TLS virtual host through its normal front controller.
    # The index-prefixed URI avoids the public clean-URI deny location while
    # remaining independent of a development-only :8080 listener.
    proxy_pass https://127.0.0.1/index.php/api/cloud-browser-viewer/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_ssl_verify off;
    proxy_ssl_server_name off;
}

# The auth endpoint is reachable only as the internal subrequest above. This
# prevents its session-scope response headers from being exposed to clients.
location = /api/cloud-browser-viewer/authorize {
    return 404;
}

location = /cloud-browser-viewer/websockify {
    auth_request /_suxios_cloud_browser_viewer_auth;
    auth_request_set $suxios_viewer_profile_scope $upstream_http_x_suxios_viewer_profile_scope;
    auth_request_set $suxios_viewer_session_scope $upstream_http_x_suxios_viewer_session_scope;
    proxy_pass http://127.0.0.1:8787/v1/viewer/websockify;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host 127.0.0.1:8787;
    proxy_set_header X-SUXIOS-Viewer-Profile-Scope $suxios_viewer_profile_scope;
    proxy_set_header X-SUXIOS-Viewer-Session-Scope $suxios_viewer_session_scope;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}

location ^~ /cloud-browser-viewer/ {
    auth_request /_suxios_cloud_browser_viewer_auth;
    proxy_pass http://127.0.0.1:6080/;
    proxy_set_header Host 127.0.0.1:6080;
    proxy_buffering off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
